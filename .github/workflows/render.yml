
name: Render F1 Wet Video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Prepare frames
        run: mkdir -p frames

      - name: Render animation frames
        run: |
          cat > render.cjs <<'EOF'
          const { chromium } = require('playwright');
          const path = require('path');

          (async () => {
            const browser = await chromium.launch({
              headless: true
            });

            try {
              const page = await browser.newPage({
                viewport: {
                  width: 720,
                  height: 1280
                },
                deviceScaleFactor: 1
              });

              await page.goto(
                'file://' + path.resolve('f1-ban-wet.html'),
                { waitUntil: 'networkidle' }
              );

              await page.evaluate(async () => {
                await document.fonts.ready;
                document.getElementById('cover').style.display = 'none';
              });

              for (let i = 0; i < 1050; i++) {
                await page.evaluate((t) => {
                  window.renderAt(t);
                }, i / 30);

                await page.locator('#stage').screenshot({
                  path: `frames/frame-${String(i).padStart(4, '0')}.jpg`,
                  type: 'jpeg',
                  quality: 90
                });

                if ((i + 1) % 150 === 0) {
                  console.log(`Frame ${i + 1}/1050`);
                }
              }
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          EOF

          node render.cjs

      - name: Encode MP4
        run: |
          ffmpeg -y \
            -framerate 30 \
            -i frames/frame-%04d.jpg \
            -c:v libx264 \
            -preset veryfast \
            -crf 22 \
            -pix_fmt yuv420p \
            -movflags +faststart \
            f1-ban-wet.mp4

      - name: Save rendered video
        uses: actions/upload-artifact@v4
        with:
          name: f1-ban-wet-mp4
          path: f1-ban-wet.mp4
          if-no-files-found: error
          retention-days: 7
